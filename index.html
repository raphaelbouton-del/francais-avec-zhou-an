<body>
<header>
  <div class="hrow">
    <button class="logo" onclick="go('home')">Zhou An 的法语小课堂<small>Le français avec Zhou An · V10.2 · 两阶段120课</small></button>
    
  </div>
</header>
<main id="app" class="wrap"></main>
<nav id="nav"></nav>
<script>
"use strict";
/* ---------- 存储 ---------- */
var KEY="zhouanfr_v1"; // Clé propre à Zhou An : ne jamais renommer lors des mises à jour.
var SHADOW_KEY="zhouanfr_v1_safety_copy"; // Copie locale de secours, sur le même navigateur.
var storageWarning=false;
function isRecord(x){return !!x&&typeof x==="object"&&!Array.isArray(x);}
function isProgressData(d){return isRecord(d)&&Array.isArray(d.done)&&Array.isArray(d.fav)&&Array.isArray(d.err)&&isRecord(d.mynotes)&&(!d.memory||isRecord(d.memory));}
function normalizeProgress(d){
  d=isRecord(d)?d:{};
  return {done:Array.isArray(d.done)?d.done.filter(function(x){return typeof x==="string"&&/^([1-9]|1[0-2])-[1-5]$/.test(x);}):[],
    fav:Array.isArray(d.fav)?d.fav:[],err:Array.isArray(d.err)?d.err:[],
    mynotes:isRecord(d.mynotes)?d.mynotes:{},current:d.current||null,last:d.last||null,
    memory:isRecord(d.memory)?d.memory:{},practice:isRecord(d.practice)?d.practice:{},
    recall:isRecord(d.recall)?d.recall:{},journal:isRecord(d.journal)?d.journal:{}};
}
function load(){
  var d=null;
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){try{var main=JSON.parse(raw);if(isProgressData(main))d=main;}catch(parseError){/* Essayer la copie de secours. */}}
    // Restaurer la copie uniquement lorsque les données principales sont absentes ou illisibles.
    if(!d){var secondary=localStorage.getItem(SHADOW_KEY);if(secondary){var copy=JSON.parse(secondary);if(isProgressData(copy)){d=copy;localStorage.setItem(KEY,JSON.stringify(copy));}}}
  }catch(e){storageWarning=true;}
  return normalizeProgress(d);
}
var S=load();
function save(){
  S.last=Date.now();
  try{
    var raw=JSON.stringify(S);
    localStorage.setItem(KEY,raw);
    localStorage.setItem(SHADOW_KEY,raw);
    storageWarning=false;
  }catch(e){storageWarning=true;}
}
function storageNotice(){return storageWarning?'<div class="fbk bad" role="alert">⚠️ 浏览器无法保存学习记录。请检查是否使用无痕浏览，并先下载学习备份。学习期间不要清除网站数据。</div>':'';}
// Mettre à jour la copie de secours dès l'ouverture, y compris pour les anciennes versions.
if(!storageWarning)save();
function isDone(id){return S.done.indexOf(id)>=0;}
function toggleDone(id){if(!isDone(id))S.done.push(id);save();}
/* V6: espacements de revision, sans changer l'identifiant de sauvegarde V5 */
var REVIEW_DELAYS=[1,3,7,14];
function dayStamp(){return Math.floor(Date.now()/86400000);}
function memoryKey(fr){return String(fr).trim().toLowerCase();}
function encounterWords(l){
  if(!S.memory)S.memory={};
  l.words.forEach(function(w){var k=memoryKey(w[0]);
    if(!S.memory[k])S.memory[k]={stage:0,due:dayStamp()+1,seen:dayStamp(),ok:0};
  });save();
}
function dueItems(){
  if(!S.memory)S.memory={};
  var w=allWords(),seen={};
  return w.filter(function(item){var k=memoryKey(item.fr);if(seen[k])return false;seen[k]=1;return S.memory[k]&&S.memory[k].due<=dayStamp();});
}
function answerMemory(fr,ok){
 var k=memoryKey(fr),r=S.memory[k]||{stage:0,seen:dayStamp(),ok:0};
 if(ok){r.stage=Math.min(4,(r.stage||0)+1);r.ok=(r.ok||0)+1;r.due=dayStamp()+REVIEW_DELAYS[Math.min(r.stage-1,3)];}
 else{r.stage=0;r.due=dayStamp()+1;}
 S.memory[k]=r;save();
}

/* ---------- 数据：60 课（12周 × 5天） ----------
   J1–J4 每天新内容；J5 为本周复习（由程序自动汇总本周词汇与句子生成）。
   拼音只标注汉字（拼音是汉语的注音，不是法语发音）。 */
function L(w,d,th,goal,words,gram,ex,exs){return {w:w,d:d,th:th,goal:goal,words:words,gram:gram,ex:ex,exs:exs};}
var LESSONS=[];
/* ===== 第1周：认识与问候 ===== */
LESSONS.push(L(1,1,"第一次见面：你好和谢谢",
"今天先学 4 个词和 1 句话：认识「我 / 你 / 你好 / 谢谢」，并看懂「我是Zhou An」。",
[["bonjour","你好","nǐ hǎo"],["merci","谢谢","xiè xie"],["je","我","wǒ"],["tu","你","nǐ"]],
"先认识两个简单对应：je = 我，tu = 你。但法语和中文的句子结构不同，不能永远一个字对应一个字。注意：卡片上的拼音是<strong>汉字的读音</strong>（帮助你确认中文），它<strong>不是</strong>法语的发音。法语我们只学「读和写」，不学「说和听」。",
[["Je suis Zhou An.","我是Zhou An。"],["Bonjour !","你好！"],["Merci !","谢谢！"]],
[{"t":"mcq","q":"「你好」的法语怎么写？","o":["bonjour","merci","je"],"a":0,"exp":"bonjour = 你好。"},
 {"t":"mcq","q":"下面哪个词表示「我」？","o":["tu","je","merci"],"a":1,"exp":"je = 我；tu = 你。"},
 {"t":"fill","q":"填空：____ suis Zhou An.（我是Zhou An。）","a":"je","exp":"je = 我。注意法语习惯首字母大写，但小写也算对。"}]));
LESSONS.push(L(1,2,"我、你、他、她",
"复习昨天的词，再加上「他 / 她」。法语里 il 和 elle 写法不同，一看就分清。",
[["il","他","tā"],["elle","她","tā"],["chinois","中国人（男）","zhōngguó rén"],["chinoise","中国人（女）","zhōngguó rén"]],
"法语的 il = 他，elle = 她：写法不同，靠眼睛就能区分。中文的“他”和“她”读音相同（tā），但汉字不同；法语也用两个不同的词。中文「中国人」不分男女，法语要在词尾加 -e 表示女性：chinois / chinoise。",
[["Il est chinois.","他是中国人。"],["Elle est chinoise.","她是中国人。"],["Tu es Zhou An ?","你是Zhou An吗？"]],
[{"t":"mcq","q":"「她是中国人」里应该用哪个词？","o":["il","elle","je"],"a":1,"exp":"女性用 elle（她）。"},
 {"t":"fill","q":"填空：Elle est ________.（她是中国人。）","a":"chinoise","exp":"女性写 chinoise，词尾多一个 e。"},
 {"t":"mcq","q":"昨天学的「我是Zhou An」，完整写一遍：","o":["Je suis Zhou An","Je est Zhou An","Tu suis Zhou An"],"a":0,"exp":"固定搭配：je suis = 我是。"}]));
LESSONS.push(L(1,3,"你叫什么名字？",
"学会问名字和回答：comment / appeler / je m'appelle。今天只有一个新句型。",
[["comment","怎么","zěn me"],["s'appeler","叫（名字）","jiào"],["je m'appelle…","我叫……","wǒ jiào"],["et toi ?","你呢？","nǐ ne"]],
"法语问名字说 Comment tu t'appelles ?（你叫什么）。回答用 je m'appelle + 名字（我叫……）。这里的 m' 是「我自己」的意思，先整体记住这个句型，不拆开分析。",
[["Comment tu t'appelles ?","你叫什么名字？"],["Je m'appelle Zhou An.","我叫Zhou An。"],["Je m'appelle Zhou An. Et toi ?","我叫Zhou An。你呢？"]],
[{"t":"order","w":["Je","m'appelle","Zhou An"],"a":"Je m'appelle Zhou An","q":"把词排成「我叫Zhou An」：","exp":"je m'appelle = 我叫，后面直接接名字。"},
 {"t":"fill","q":"填空：Comment tu t'______ ?（你叫什么名字？）","a":"appelles","exp":"s'appeler 的问句形式，整体记住即可。"},
 {"t":"mcq","q":"「我叫Zhou An」怎么说？","o":["Je m'appelle Zhou An","Je suis appelle Zhou An","Comment Zhou An"],"a":0,"exp":"je m'appelle + 名字。"}]));
LESSONS.push(L(1,4,"介绍身份与法国手语",
"认识 sourd / sourde（聋的）和 LSF（法国手语）；了解如何根据实际情况介绍自己。",
[["sourd / sourde","聋的（男/女）","lóng"],["la langue des signes","手语","shǒu yǔ"],["LSF","法国手语（缩写）","fǎguó shǒu yǔ"],["lire","读 / 看（文字）","dú"],["écrire","写","xiě"]],
"LSF 是<strong>法国手语</strong>，它和书面法语是两种独立的语言，就像汉语和手语也不是一回事。如果适用于自己，男性可以说：Je suis sourd.（我是聋人。）女性说 Je suis sourde。Je lis le français.（我能读法语。）我们这个课堂学习法语的阅读与写作，不需要听力。",
[["Je suis sourd.","我是聋人。（男性说法）"],["Je lis le français.","我读法语。"],["J'écris un message.","我写一条消息。"]],
[{"t":"mcq","q":"男性说「我是聋人」：","o":["Je suis sourde","Je suis sourd","Il est sourde"],"a":1,"exp":"男性用 sourd；女性用 sourde。只有符合自己的情况才这样介绍。"},
 {"t":"mcq","q":"LSF 指的是：","o":["法国手语","法国美食","法国城市"],"a":0,"exp":"LSF = langue des signes française，法国手语。"},
 {"t":"fill","q":"填空：Je ______ le français.（我读法语。）","a":"lis","exp":"lire 的「我」形式是 lis。"}]));
/* ===== 第2周：家庭 ===== */
LESSONS.push(L(2,1,"我的家人（一）",

function fbEl(ok,txt){var d=document.createElement("div");d.className="fbk "+(ok?"ok":"bad");d.innerHTML=(ok?"✓ 对了！":"✗ 再看一眼：")+txt;return d;}
function markDone(){exState.done++; if(exState.done>=exState.total){var f=document.getElementById("finbox");if(f&&!f.querySelector(".donetag")){var t=document.createElement("p");t.className="donetag okline";t.textContent="✓ 练习全部完成，可以点「完成本课」了！";f.insertBefore(t,f.firstChild);}}}
function buildEx(e,i,l){
  var d=document.createElement("div");d.className="card";
  var types={mcq:"选择",fill:"填空",order:"排列",match:"配对"};
  var t=document.createElement("p");t.innerHTML='<span class="tag">'+(i+1)+'/'+exState.total+' · '+(types[e.t]||"练习")+'</span> '+esc(e.q||"找出正确的法语和中文配对：");d.appendChild(t);
  var solved=false,failedOnce=false;
  function show(ok,msg){
    var old=d.querySelector(".fbk");if(old)old.remove();
    d.appendChild(fbEl(ok,msg));
    if(ok&&!solved){solved=true;markDone();}
    if(!ok&&!failedOnce){failedOnce=true;logErr((l?l.th:"")+": "+(e.q||"配对"));}
  }
  if(e.t==="mcq"){
    shuffle(e.o.slice()).forEach(function(o){
      var b=document.createElement("button");b.className="qopt";b.textContent=o;
      b.onclick=function(){if(solved)return;var ok=e.o[e.a]===o;
        d.querySelectorAll(".qopt").forEach(function(x){x.classList.remove("correct","wrong");});
        b.classList.add(ok?"correct":"wrong");show(ok,ok?(e.exp||"很好！"):"还不是这个答案，再试一次。");};d.appendChild(b);
    });
  }else if(e.t==="fill"){
    var inp=document.createElement("input");inp.className="txt";inp.setAttribute("aria-label","请填写法语答案");inp.autocomplete="off";d.appendChild(inp);
    var b=document.createElement("button");b.className="btn";b.style.marginTop="10px";b.textContent="检查";
    b.onclick=function(){if(solved)return;var ok=norm(inp.value)===norm(e.a);show(ok,ok?(e.exp||"很好！"):"再试一次。提示："+(e.exp||"请仔细看上面的词语。"));};
    inp.addEventListener("keydown",function(ev){if(ev.key==="Enter")b.click();});d.appendChild(b);
  }else if(e.t==="order"){
    var selected=[],parts=e.w.map(function(v,j){return{word:v,id:j};}),mixed=shuffle(parts);
    var slot=document.createElement("div");slot.className="slotline";d.appendChild(slot);
    var pool=document.createElement("div");d.appendChild(pool);
    function draw(){slot.innerHTML="";pool.innerHTML="";
      selected.forEach(function(p,j){var b=document.createElement("button");b.className="chip";b.textContent=p.word;b.title="点这里撤销这个词";b.onclick=function(){if(solved)return;selected.splice(j,1);draw();};slot.appendChild(b);});
      mixed.filter(function(p){return !selected.some(function(x){return x.id===p.id;});}).forEach(function(p){var b=document.createElement("button");b.className="chip";b.textContent=p.word;b.onclick=function(){if(solved)return;selected.push(p);draw();};pool.appendChild(b);});
      if(!selected.length)slot.textContent="按顺序点击下面的法语词";
    }
    draw();
    var b=document.createElement("button");b.className="btn";b.textContent="检查";
    b.onclick=function(){if(solved)return;var ok=norm(selected.map(function(x){return x.word;}).join(" "))===norm(e.a);show(ok,ok?(e.exp||"非常好！"):"词语顺序还不对，可以点上面的词撤销后再试。")};d.appendChild(b);
  }else if(e.t==="match"){
    var words=e.pairs.map(function(p,j){return{fr:p[0],zh:p[1],id:j};});
    var left=document.createElement("div"),right=document.createElement("div"),grid=document.createElement("div");grid.className="pairgrid";grid.appendChild(left);grid.appendChild(right);d.appendChild(grid);
    var selected=-1,matched=[];
    words.forEach(function(p){var b=document.createElement("button");b.className="chip";b.textContent=p.fr;b.setAttribute("data-fri",p.id);b.onclick=function(){if(solved||matched.includes(p.id))return;selected=p.id;refresh();};left.appendChild(b);});
    shuffle(words).forEach(function(p){var b=document.createElement("button");b.className="chip";b.textContent=p.zh;b.setAttribute("data-zhi",p.id);b.onclick=function(){if(solved||matched.includes(p.id)||selected<0)return;
      if(selected===p.id){matched.push(p.id);selected=-1;refresh();if(matched.length===words.length)show(true,"全部配对正确！");}
      else{selected=-1;refresh();show(false,"还不对，请重新选择一组词语。");}
    };right.appendChild(b);});
    function refresh(){d.querySelectorAll("[data-fri]").forEach(function(b){var id=Number(b.dataset.fri);b.classList.toggle("selected",id===selected);b.classList.toggle("matched",matched.includes(id));b.disabled=matched.includes(id);});d.querySelectorAll("[data-zhi]").forEach(function(b){var id=Number(b.dataset.zhi);b.classList.toggle("matched",matched.includes(id));b.disabled=matched.includes(id);});}
  }
  return d;
}

function importZhouAnBackup(input){
  var file=input.files&&input.files[0];if(!file)return;
  if(file.size>2*1024*1024){alert("备份文件太大，无法导入。");input.value="";return;}
  var reader=new FileReader();
  reader.onerror=function(){alert("无法读取这个文件。");input.value="";};
  reader.onload=function(){
    try{
      var obj=JSON.parse(reader.result);
      if(obj.format!=="zhouan-francais-backup"||obj.version!==1||!obj.data||!Array.isArray(obj.data.done)||!Array.isArray(obj.data.fav)||!Array.isArray(obj.data.err)||!obj.data.mynotes||typeof obj.data.mynotes!=="object"||!obj.data.memory||typeof obj.data.memory!=="object")throw Error("format");
      var d=obj.data;
      if(d.done.length>200||d.fav.length>2000||d.err.length>300)throw Error("volume");
      if(!d.done.every(function(x){return typeof x==="string"&&/^([1-9]|1[0-2])-[1-5]$/.test(x);})||!d.fav.every(function(x){return typeof x==="string"&&x.length<120;}))throw Error("fields");
      var notes=Object.keys(d.mynotes),keys=Object.keys(d.memory);
      if(notes.length>65||keys.length>2000||!notes.every(function(k){return /^([1-9]|1[0-2])-[1-5]$/.test(k)&&typeof d.mynotes[k]==="string"&&d.mynotes[k].length<10000;}))throw Error("notes");
      if(!keys.every(function(k){var r=d.memory[k];return k.length<120&&r&&typeof r==="object"&&Number.isFinite(r.due)&&r.due>=0&&Number.isFinite(r.stage)&&r.stage>=0&&r.stage<=4&&Number.isFinite(r.ok)&&r.ok>=0;}))throw Error("memory");
      if(!confirm("确定要合并这个备份吗？已经完成的课程、收藏和当前笔记都不会被删除。"))return;
      // Fusion sans perte : même un fichier plus ancien ne doit pas effacer le travail récent.
      var combined=normalizeProgress(S);
      combined.done=Array.from(new Set(combined.done.concat(d.done)));
      combined.fav=Array.from(new Set(combined.fav.concat(d.fav)));
      combined.err=combined.err.concat(d.err).slice(-300);
      Object.keys(d.mynotes).forEach(function(id){if(!combined.mynotes[id]&&d.mynotes[id])combined.mynotes[id]=d.mynotes[id];});
      Object.keys(d.memory).forEach(function(k){
        var old=combined.memory[k],incoming=d.memory[k];
        if(!old){combined.memory[k]=incoming;return;}
        if((incoming.stage||0)>(old.stage||0)||((incoming.stage||0)===(old.stage||0)&&(incoming.ok||0)>(old.ok||0)))combined.memory[k]=incoming;
      });
      // Restaurer aussi les exercices V9/V10 sans toucher aux cours déjà terminés.
      ['practice','recall'].forEach(function(field){
        if(!isRecord(d[field]))return;
        var entries=Object.keys(d[field]).slice(0,400);
        entries.forEach(function(k){
          if(k.length>120||!isRecord(d[field][k]))return;
          var incoming=d[field][k],old=combined[field][k];
          if(!old || ((Number(incoming.attempts)||0)>(Number(old.attempts)||0)))combined[field][k]=incoming;
        });
      });
      if(isRecord(d.journal))Object.keys(d.journal).slice(0,150).forEach(function(k){
        if(k.length<100&&typeof d.journal[k]==='string'&&d.journal[k].length<3000&&!combined.journal[k])combined.journal[k]=d.journal[k];
      });
      if(!combined.current)combined.current=d.current||null;
      S=combined;save();if(isRecord(d.part2))p2Merge(d.part2);go("progress");alert("学习记录已安全合并！以前完成的课程都保留了。");
    }catch(e){alert("这个文件不是有效的学习备份，请检查文件。 ");}
    finally{input.value="";}
  };
  reader.readAsText(file,"utf-8");
}

 due.sort(function(a,b){return (state[a.id].due||0)-(state[b.id].due||0);});

[15,1,'昨天做了什么？avoir + participe passé','认识复合过去时的基本结构',

[17, 1, "我今天的心情（男性说法）", "用完整句表达快乐、担心与疲惫。", [["content", "高兴的（男性）"], ["inquiet", "担心的（男性）"], ["fatigué", "疲惫的（男性）"], ["soulagé", "松了一口气的（男性）"], ["un peu", "有一点"]], "描述自己的心情时常用 <b>je suis + 形容词</b>。男性说 <b>content / inquiet / fatigué / soulagé</b>；女性形式是 contente / inquiète / fatiguée / soulagée。<b>un peu</b> 表示程度不强，如 « Je suis un peu inquiet. »。不用急着记住全部词尾，先结合情境理解。", [["Je suis content aujourd’hui.", "我今天很开心。"], ["Je suis un peu inquiet.", "我有点担心。"], ["Maintenant, je suis soulagé.", "现在我松了一口气。"]], [["Je suis ___ aujourd’hui.（我今天很开心，男性）", "content", "男性形式为 content。"], ["Je suis un ___ inquiet.", "peu", "un peu = 有一点。"], ["Maintenant, je suis ___.（松了一口气，男性）", "soulagé", "男性形式为 soulagé。"]], "写三句话，分别说明你现在的心情、今天早上的心情，以及为什么不同。"],
[17, 2, "为什么？因为……", "用 parce que 解释情绪的原因。", [["parce que", "因为"], ["pourquoi", "为什么"], ["heureuse", "幸福、快乐的（女性）"], ["stressée", "有压力的（女性）"], ["une bonne nouvelle", "好消息"]], "<b>Pourquoi ?</b> 用来问原因；<b>parce que</b> 用来回答。例：« Pourquoi es-tu heureuse ? — Parce que j’ai une bonne nouvelle. »。在元音前，<b>que</b> 会写成 <b>qu’</b>：parce qu’il pleut。区分“原因”和“时间”。", [["Pourquoi es-tu heureuse ?", "你为什么高兴？"], ["Je suis heureuse parce que j’ai une bonne nouvelle.", "我很高兴，因为我有个好消息。"]], [["___ es-tu heureuse ?", "Pourquoi", "问原因。"], ["Je suis heureuse ___ que tu es là.", "parce", "parce que 表示因为。"], ["Je suis stressée parce ___ j’ai beaucoup de travail.", "que", "parce que 后面接原因。"]], "用 parce que 写两句，说明你今天为什么开心或疲惫。"],
[17, 3, "表达喜欢和偏好", "比较 j’aime、je préfère 与 je déteste 的语气。", [["je préfère", "我更喜欢"], ["j’aime bien", "我挺喜欢"], ["je déteste", "我讨厌"], ["plutôt", "比较、宁愿"], ["un choix", "选择"]], "<b>J’aime bien</b> 表示喜欢；<b>je préfère A à B</b> 表示比起 B 更喜欢 A；<b>je déteste</b> 表示很不喜欢，语气更强。不要把 « Je préfère » 理解成 « 我必须 »。", [["J’aime bien le café.", "我挺喜欢咖啡。"], ["Je préfère le train à la voiture.", "比起汽车，我更喜欢火车。"], ["Je déteste attendre longtemps.", "我讨厌等太久。"]], [["Je ___ le train à la voiture.", "préfère", "表达更喜欢。"], ["J’___ bien le café.", "aime", "j’aime bien。"], ["Je ___ attendre longtemps.（我讨厌）", "déteste", "语气较强。"]], "写三个偏好：食物、交通工具、休息方式，至少用一次 je préfère。"],
[17, 4, "安慰与鼓励", "读懂并写出有温度的短消息。", [["bon courage", "加油、祝顺利"], ["prends soin de toi", "照顾好自己"], ["ça va aller", "会好起来的"], ["je pense à toi", "我想着你"], ["repose-toi", "休息一下"]], "这些短句可以直接用于 WhatsApp。<b>Prends soin de toi</b> 和 <b>Repose-toi</b> 是对一个熟悉的人提出的建议或关心；<b>Bon courage</b> 常用来鼓励正在面对困难的人。注意：实际交流应根据对方的情况选择，不必一次用很多句。", [["Tu es fatiguée ? Repose-toi.", "你累了吗？休息一下。"], ["Bon courage pour demain !", "祝你明天顺利！"], ["Je pense à toi.", "我想着你。"]], [["Bon ___ pour demain !", "courage", "表示鼓励。"], ["Prends soin de ___.", "toi", "对熟人表达关心。"], ["Je pense ___ toi.", "à", "penser à quelqu’un。"]], "给一位今天很累的朋友写一条两句以上的温柔消息。"],
[18, 1, "读懂一条完整消息", "找出消息中的问题、时间和请求。", [["tu peux", "你能……吗"], ["ce soir", "今晚"], ["répondre", "回复"], ["disponible", "有空的"], ["rapidement", "很快地"]], "先在一条消息中寻找三个线索：<b>谁</b>、<b>何时</b>、<b>希望你做什么</b>。« Tu peux me répondre ce soir ? » 是请求，不只是询问能力。回复时可以确认时间或提出其他时间。", [["Tu peux me répondre ce soir ?", "你今晚能回复我吗？"], ["Je suis disponible après huit heures.", "我八点以后有空。"]], [["Tu peux me ___ ce soir ?", "répondre", "回复 = répondre。"], ["Je suis ___ après huit heures.", "disponible", "表示有空。"], ["Tu peux répondre ___ ?（很快）", "rapidement", "副词表示很快地。"]], "给「今晚八点后你有空吗？」写一个完整回复：同意或礼貌改时间。"],
[18, 2, "礼貌地提出请求", "区分 tu peux、pourrais-tu 与 s’il te plaît。", [["tu pourrais", "你能否……（更委婉）"], ["s’il te plaît", "请（对熟人）"], ["envoyer", "发送"], ["un document", "一份文件"], ["quand tu peux", "你方便时"]], "<b>Tu peux… ?</b> 是日常说法；<b>Tu pourrais… ?</b> 更委婉。对熟人可以加 <b>s’il te plaît</b>。« Quand tu peux » 表示不用立刻回应。礼貌不意味着句子必须很长。", [["Tu pourrais m’envoyer le document ?", "你能把文件发给我吗？"], ["Réponds quand tu peux, s’il te plaît.", "你方便的时候回复我就好。"]], [["Tu ___ m’envoyer le document ?（更委婉）", "pourrais", "tu pourrais。"], ["Réponds quand tu ___.", "peux", "你方便时。"], ["S’il te ___ !", "plaît", "固定搭配。"]], "写一条礼貌消息，请别人发一张照片或一份资料。"],
[18, 3, "说明误会、重新确认", "用 je n’ai pas compris 和 tu veux dire… ?。", [["je n’ai pas compris", "我没理解"], ["tu veux dire… ?", "你是说……吗"], ["exactement", "确切地"], ["répéter", "重复"], ["une précision", "一个补充说明"]], "交流出现误会时，可以先说 <b>Je n’ai pas compris.</b> 再问 <b>Tu veux dire… ?</b>。在书面消息中，<b>Tu peux préciser ?</b> 比单独发很多问号更清楚。<b>compris</b> 是 comprendre 的过去分词。", [["Je n’ai pas compris ton message.", "我没理解你的消息。"], ["Tu veux dire vendredi ou samedi ?", "你是说星期五还是星期六？"]], [["Je n’ai pas ___ ton message.", "compris", "过去分词 compris。"], ["Tu veux ___ vendredi ?", "dire", "你是说。"], ["Tu peux ___ ?（补充说明）", "préciser", "明确说明。"]], "写两句：礼貌表示没理解，再问对方是否指星期五。"],
[18, 4, "回复不同意见", "温和表达同意、不同意或折中。", [["je suis d’accord", "我同意"], ["je ne suis pas d’accord", "我不同意"], ["mais", "但是"], ["peut-être", "或许"], ["on peut essayer", "我们可以试试看"]], "<b>Je suis d’accord</b> 表示同意。不同意时可以先认可对方的观点，再加 <b>mais</b>，例如 « Je comprends, mais je préfère samedi. »。<b>On peut essayer</b> 是开放的折中方式。", [["Je suis d’accord avec toi.", "我同意你的看法。"], ["Je comprends, mais je préfère samedi.", "我理解，但我更喜欢星期六。"], ["On peut essayer une autre solution.", "我们可以试试另一种办法。"]], [["Je suis d’___ avec toi.", "accord", "固定搭配。"], ["Je comprends, ___ je préfère samedi.", "mais", "表示转折。"], ["On peut ___.", "essayer", "试试看。"]], "写一段两到三句的回复：对方建议周五见面，你更喜欢周六。"],
[19, 1, "看懂车票和出发时间", "阅读车站、站台和出发信息。", [["le départ", "出发"], ["l’arrivée", "抵达"], ["le quai", "站台"], ["la voie", "轨道编号／站台股道"], ["à l’heure", "准时"]], "读车票时优先找 <b>départ（出发）</b>、<b>arrivée（到达）</b> 和时间。在法国车站，<b>voie</b> 常指列车所用股道，<b>quai</b> 指乘客候车的站台。注意具体车次的信息以当日车站公告为准。", [["Le train part à 14 h 20.", "火车14点20分出发。"], ["Le départ est voie 4.", "列车从4号股道出发。"]], [["Le train ___ à 14 h 20.", "part", "partir 的第三人称。"], ["Le ___ est voie 4.", "départ", "出发。"], ["Le train est ___ l’heure.", "à", "à l’heure = 准时。"]], "编写一条短消息，告诉朋友列车几点出发、从几号股道离开。"],
[19, 2, "换乘与方向", "描述从一条线路换乘另一条线路。", [["la correspondance", "换乘"], ["changer de ligne", "换线"], ["descendre", "下车"], ["monter", "上车"], ["direction", "方向／终点方向"]], "<b>Je descends à…</b> 表示我在某站下车；<b>je change de ligne</b> 表示换线；<b>je prends la ligne…</b> 表示乘某条线。阅读地图时要同时看方向和站名，而不只看线路颜色。", [["Je descends à la prochaine station.", "我在下一站下车。"], ["Je change de ligne à République.", "我在共和国站换线。"]], [["Je ___ de ligne à République.", "change", "changer de ligne。"], ["Je ___ à la prochaine station.", "descends", "descendre = 下车。"], ["Je prends la ligne 2 en ___ du centre.", "direction", "表示方向。"]], "写一段两句的路线说明，包含在哪里下车和在哪里换线。"],
[19, 3, "延误与改时间", "看懂 retard、annulé 并通知朋友。", [["en retard", "晚点"], ["annulé", "取消的（阳性）"], ["prévu", "原定的"], ["attendre", "等待"], ["finalement", "最终／结果"]], "<b>Le train est en retard.</b> 表示列车晚点；<b>Le train est annulé.</b> 表示取消。通知别人时最好说明影响和下一步，例如 « J’arriverai plus tard. »。这里出现的将来时先作为常用句理解即可。", [["Mon train a vingt minutes de retard.", "我的火车晚点20分钟。"], ["Le train est annulé.", "列车被取消了。"], ["Je vais arriver plus tard.", "我会晚一点到。"]], [["Mon train est en ___.", "retard", "晚点。"], ["Le train est ___.（被取消）", "annulé", "注意阳性形式。"], ["Je vais arriver plus ___.", "tard", "更晚。"]], "写一条短信：火车晚点20分钟，你会晚到，并向对方说明。"],
[19, 4, "在城市里求助", "请求书面方向说明与无障碍信息。", [["un plan", "地图"], ["la sortie", "出口"], ["accessible", "可进入／无障碍的"], ["un ascenseur", "电梯"], ["indiquer", "指示、告诉"]], "使用 <b>Où est… ?</b> 或 <b>Vous pouvez m’indiquer… ?</b> 请求方向；用 <b>Il y a un ascenseur ?</b> 询问是否有电梯。对不熟悉的人常用 vous。若需要书面信息，可以说 « Vous pouvez l’écrire ? »。", [["Où est la sortie, s’il vous plaît ?", "请问出口在哪里？"], ["Y a-t-il un ascenseur ?", "有电梯吗？"], ["Vous pouvez l’écrire ?", "您能写下来吗？"]], [["Où est la ___ ?（出口）", "sortie", "表示出口。"], ["Il y a un ___ ?（电梯）", "ascenseur", "表示电梯。"], ["Vous pouvez l’___ ?（写下来）", "écrire", "不定式 écrire。"]], "写一段在车站使用的询问信息，至少问出口和电梯在哪里。"],

function p2Load(){
 try{var v=JSON.parse(localStorage.getItem(P2_KEY)||'{}');return {done:Array.isArray(v.done)?v.done.filter(function(x){return /^(?:1[3-9]|2[0-4])-[1-5]$/.test(x);}):[],notes:isRecord(v.notes)?v.notes:{},review:isRecord(v.review)?v.review:{}};}catch(e){return {done:[],notes:{},review:{}};}
}
function p2Save(v){try{localStorage.setItem(P2_KEY,JSON.stringify(v));}catch(e){storageWarning=true;}}
function p2Merge(v){var x=p2Load();if(Array.isArray(v.done))x.done=Array.from(new Set(x.done.concat(v.done.filter(function(id){return typeof id==='string'&&/^(?:1[3-9]|2[0-4])-[1-5]$/.test(id);}))));
 if(isRecord(v.notes))Object.keys(v.notes).forEach(function(k){if(/^(?:1[3-9]|2[0-4])-[1-5]$/.test(k)&&typeof v.notes[k]==='string'&&v.notes[k].length<4000&&!x.notes[k])x.notes[k]=v.notes[k];});
 if(isRecord(v.review))Object.keys(v.review).slice(0,120).forEach(function(k){if(/^(?:1[3-9]|2[0-4])-[1-5]$/.test(k)&&isRecord(v.review[k])&&!x.review[k])x.review[k]=v.review[k];});p2Save(x);}
function p2Get(w,d){return P2_DATA.find(function(q){return q[0]===w&&q[1]===d;});}
function p2Completed(){return p2Load().done.length;}

 var progress=p2Load();
 if(isRecord(arg)&&arg.w&&arg.d){renderP2Lesson(arg.w,arg.d);return;}
 var h='<h1>🌿 第二阶段 · 进阶法语</h1><p>第13–24周：从认识法语，到能够独立理解和写出真实消息。第13–24周的60节课程全部开放，每周含4节新课和1节综合复习。</p>'+storageNotice();
 h+='<div class="card"><h3>两个独立的学习进度</h3><p>第一阶段：<b>'+S.done.length+' / 60</b> 节已完成</p><p>第二阶段：<b>'+p2Completed()+' / 60</b> 节已完成</p><p class="muted">旧课程的成绩不会清零。第二阶段可自由体验，但建议先巩固第一阶段的基础。</p><button class="btn ghost" onclick="go(\'progress\')">保存我的全部学习记录</button></div>';
 P2_WEEKS.forEach(function(w){var enabled=w[0]<=24;var done=progress.done.filter(function(id){return id.indexOf(w[0]+'-')===0;}).length;
  h+='<div class="card"><h3>第'+w[0]+'周 · '+esc(w[1])+(enabled?' · '+done+'/5':' · 即将开放')+'</h3><p class="muted">'+esc(w[2])+'</p>';
  if(enabled){for(var d=1;d<=5;d++){var title=d===5?'本周综合复习':p2Get(w[0],d)[2];h+='<button class="daybtn" style="width:100%;margin:6px 0" onclick="go(\'part2\',{w:'+w[0]+',d:'+d+'})"><span class="dn">第'+d+'课 · '+esc(title)+(progress.done.indexOf(w[0]+'-'+d)>=0?' ✓':'')+'</span></button>';}}
  else h+='<p class="muted">本周课程已开放。</p>';h+='</div>';
 });app.innerHTML=h;
}
function p2SaveNote(w,d){var id=w+'-'+d,el=document.getElementById('p2note');if(!el)return;var x=p2Load();x.notes[id]=el.value.slice(0,4000);p2Save(x);var status=document.getElementById('p2notestatus');if(status)status.textContent='已保存在这台设备。';}
function p2Done(w,d){p2SaveNote(w,d);var x=p2Load(),id=w+'-'+d;if(x.done.indexOf(id)<0)x.done.push(id);p2Save(x);go('part2',{w:w,d:d});}
function p2Review(w){var prev=P2_DATA.filter(function(v){return v[0]===w;});
 var words=prev.map(function(x){return x[4][0];});var ex=[];prev.forEach(function(x){ex.push(x[7][0]);});
 return [w,5,'本周综合复习','回忆这一周的语法，再用自己的话写一段短文。',words,'先尝试不看答案。答错不影响已经完成的旧课程；需要时可以回到本周课程查阅。',prev.map(function(x){return x[6][0];}),ex,'试着写3–5句，尽量使用这一周的新语法。'];
}
function renderP2Lesson(w,d){var l=d===5?p2Review(w):p2Get(w,d);if(!l){go('part2');return;}var id=w+'-'+d,x=p2Load();
 var h='<p><button class="btn ghost" onclick="go(\'part2\')">← 返回进阶课程</button></p><h1>第'+w+'周 · 第'+d+'课</h1><h2>'+esc(l[2])+'</h2><p>'+esc(l[3])+'</p>';
 if(x.done.indexOf(id)>=0)h+='<div class="fbk ok">✓ 本课已完成，随时可以复习。</div>';
 h+='<div class="card"><h3>① 今日词汇 · 新词与复习</h3>';
 l[4].forEach(function(q){h+='<div class="wordcard"><div class="wfr">'+esc(q[0])+'</div><div class="whz">'+esc(q[1])+'</div>'+elixButton(q[0])+'</div>';});h+='</div>';
 h+='<div class="card"><h3>② 句子与语法</h3><p>'+l[5]+'</p>';
 l[6].forEach(function(a){h+='<div class="v6bubble"><strong>'+esc(a[0])+'</strong><small>'+esc(a[1])+'</small></div>';});h+='</div>';
 h+='<div class="card"><h3>③ 无提示填空挑战</h3><p class="muted">先自己写，再检查。答案和提示用中文说明。可以多练几次。</p>';
 l[7].forEach(function(q,i){h+='<div class="advanced-question"><label for="p2q'+i+'">'+(i+1)+'. '+esc(q[0])+'</label><input id="p2q'+i+'" autocomplete="off" placeholder="写出缺少的法语" aria-label="第'+(i+1)+'题"><button class="btn ghost" style="margin-top:8px" onclick="p2Check('+w+','+d+','+i+')">检查 · 查看提示</button><p class="advanced-result" id="p2fb'+i+'" role="status"></p></div>';});h+='</div>';
 h+='<div class="card"><h3>④ 用自己的话写</h3><p>'+esc(l[8])+'</p><textarea class="txt" id="p2note" style="min-height:110px;width:100%" placeholder="试着写几句法语……">'+esc(x.notes[id]||'')+'</textarea><p><button class="btn ghost" onclick="p2SaveNote('+w+','+d+')">保存我的句子</button></p><p id="p2notestatus" class="muted" role="status"></p><button class="btn sec" onclick="p2Done('+w+','+d+')">完成本课 ✓</button><p class="muted">完成只是学习记录，错误不会扣分。旧课程不受影响。</p></div>';
 app.innerHTML=h;
 var ta=document.getElementById('p2note');if(ta)ta.addEventListener('input',function(){p2SaveNote(w,d);});
}
function p2Norm(s){return String(s).normalize('NFC').toLowerCase().replace(/[’‘]/g,"'").replace(/[.!?。？,，;；\s]+/g,' ').trim();}
function p2Check(w,d,i){var l=d===5?p2Review(w):p2Get(w,d),q=l[7][i],inp=document.getElementById('p2q'+i),fb=document.getElementById('p2fb'+i);if(!inp||!fb)return;
 var val=p2Norm(inp.value),correct=p2Norm(q[1]);var ok=val===correct;fb.className='advanced-result fbk '+(ok?'ok':'bad');fb.textContent=ok?'✓ 正确！ '+q[2]:'再想一想。提示：'+q[2]+'（参考答案：'+q[1]+'）';
 var p=p2Load(),id=w+'-'+d;if(!isRecord(p.review[id]))p.review[id]={};p.review[id][i]={ok:ok,at:Date.now()};p2Save(p);
}

go("home");
